<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WeRead Desk 设置</title>
<style>
  :root {
    --bg: #1e1f24; --panel: #2a2c33; --fg: #e8e9ec; --dim: #9aa0aa;
    --accent: #2aae67; --border: #3a3d46;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif; padding: 20px; }
  h1 { font-size: 17px; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; }
  .row + .row { border-top: 1px solid var(--border); }
  .label small { display: block; color: var(--dim); font-size: 12px; }
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: .15s; cursor: pointer; }
  .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  #hotkey-input { width: 200px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--fg); padding: 8px 10px; font-size: 14px; text-align: center; cursor: pointer; }
  #hotkey-input:focus { outline: none; border-color: var(--accent); }
  #hotkey-input.capturing { border-color: var(--accent); color: var(--accent); }
  .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .footer { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 22px; font-size: 14px; cursor: pointer; }
  button:active { filter: brightness(.88); }
  #status { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
  <h1>WeRead Desk 设置</h1>
  <div class="sub">更改立即生效，配置存于 %APPDATA%\WeReadDesk\config.json</div>

  <div class="card">
    <div class="row">
      <div class="label">启用全局快捷键<small>唤起 / 隐藏主窗口</small></div>
      <label class="switch"><input type="checkbox" id="hotkey-enabled"><span class="slider"></span></label>
    </div>
    <div class="row">
      <div class="label">快捷键组合<small>点击输入框后按下新组合，需含修饰键（Ctrl/Alt/Shift/Win）</small></div>
      <input id="hotkey-input" readonly placeholder="点击设置">
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="label">最小化到托盘<small>点最小化按钮时隐藏到系统托盘</small></div>
      <label class="switch"><input type="checkbox" id="minimize-to-tray"><span class="slider"></span></label>
    </div>
    <div class="row">
      <div class="label">关闭到托盘<small>点右上角 X 时隐藏到托盘；退出请用托盘菜单「退出」</small></div>
      <label class="switch"><input type="checkbox" id="close-to-tray"><span class="slider"></span></label>
    </div>
    <div class="row">
      <div class="label">启动时最小化<small>开机/启动后直接进入托盘</small></div>
      <label class="switch"><input type="checkbox" id="start-minimized"><span class="slider"></span></label>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="label">开机自启<small>登录 Windows 后自动运行（当前用户）</small></div>
      <label class="switch"><input type="checkbox" id="autostart"><span class="slider"></span></label>
    </div>
  </div>

  <div class="footer">
    <button id="save">保存</button>
    <span id="status"></span>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const inputs = {
    hotkey_enabled: $("hotkey-enabled"),
    hotkey: $("hotkey-input"),
    minimize_to_tray: $("minimize-to-tray"),
    close_to_tray: $("close-to-tray"),
    start_minimized: $("start-minimized"),
    autostart: $("autostart"),
  };
  const MODS = { Control: "ctrl", Alt: "alt", Shift: "shift", Meta: "win" };

  function keyName(e) {
    if (MODS[e.key]) return null;                    // 纯修饰键
    if (e.key === " ") return "space";
    if (e.key.length === 1) return e.key.toLowerCase();
    const k = e.key.toLowerCase();
    return ["tab", "escape", "enter", "arrowup", "arrowdown", "arrowleft", "arrowright",
            "home", "end", "pageup", "pagedown", "insert", "delete", "backspace"]
            .includes(k) ? (k === "escape" ? "esc" : k.replace("arrow", "")) : null;
  }

  function comboFromEvent(e) {
    const key = keyName(e);
    if (!key) return null;
    const parts = [];
    if (e.ctrlKey) parts.push("ctrl");
    if (e.altKey) parts.push("alt");
    if (e.shiftKey) parts.push("shift");
    if (e.metaKey) parts.push("win");
    if (!parts.length) return null;                  // 必须带修饰键
    parts.push(key);
    return parts.join("+");
  }

  // 快捷键捕获
  inputs.hotkey.addEventListener("keydown", e => {
    e.preventDefault();
    if (e.key === "Backspace" && !e.ctrlKey && !e.altKey && !e.shiftKey) {
      inputs.hotkey.value = "";
      return;
    }
    const combo = comboFromEvent(e);
    if (combo) inputs.hotkey.value = combo;
  });
  inputs.hotkey.addEventListener("focus", () => inputs.hotkey.classList.add("capturing"));
  inputs.hotkey.addEventListener("blur", () => inputs.hotkey.classList.remove("capturing"));

  async function load() {
    const s = await window.pywebview.api.get_settings();
    inputs.hotkey_enabled.checked = s.hotkey_enabled;
    inputs.hotkey.value = s.hotkey || "";
    inputs.minimize_to_tray.checked = s.minimize_to_tray;
    inputs.close_to_tray.checked = s.close_to_tray;
    inputs.start_minimized.checked = s.start_minimized;
    inputs.autostart.checked = s.autostart;
  }

  $("save").addEventListener("click", async () => {
    $("status").textContent = "保存中…";
    const result = await window.pywebview.api.save_settings({
      hotkey_enabled: inputs.hotkey_enabled.checked,
      hotkey: inputs.hotkey.value.trim(),
      minimize_to_tray: inputs.minimize_to_tray.checked,
      close_to_tray: inputs.close_to_tray.checked,
      start_minimized: inputs.start_minimized.checked,
      autostart: inputs.autostart.checked,
    });
    $("status").textContent = result;
  });

  window.addEventListener("pywebviewready", load);
</script>
</body>
</html>
